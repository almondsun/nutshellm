[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutshellm"
version = "0.1.0"
description = "Adaptive, quality-aware context optimization powered by Paritok."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "tiktoken>=0.7,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
nutshellm = "nutshellm.main:run"

[tool.hatch.build.targets.wheel]
packages = ["backend/nutshellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
